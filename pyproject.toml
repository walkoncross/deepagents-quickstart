[project]
name = "quickstart"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "James Zhao", email = "zhaoyafei0210@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.11",
    "langchain-deepseek>=1.1.0",
    "python-dotenv>=1.2.3",
    "tavily-python>=0.8.0",
]

[project.optional-dependencies]
# 链路追踪二选一:只用 LangSmith 则无需安装额外依赖
# (langsmith 已随 langchain-core 内置);用 Langfuse 时安装本 extras
langfuse = ["langfuse>=4.15.1"]

[project.scripts]
quickstart = "quickstart:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
